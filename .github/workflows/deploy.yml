name: Deploy to Elastic Beanstalk environment

on:
  push:
    branches: [ dev, main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Prevent concurrent runs at the workflow level to avoid simultaneous deployments to the same environment.
concurrency:
  group: beanstalk-deploy

jobs:
  deploy_to_eb:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Set up environment variables on the runner so that EB CLI can use them for authentication
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ secrets.EB_PYTHON_VERSION }}

      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      - name: Init EB directory
        run: |
          eb init ${{ secrets.EB_APPLICATION_NAME }} -p python-${{ secrets.EB_PYTHON_VERSION }} -r ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Deploy to Elastic Beanstalk environment
        run: >-
          eb deploy "${{ secrets.EB_ENVIRONMENT_NAME }}"
          --message "Deploy ${{ github.sha }}"
