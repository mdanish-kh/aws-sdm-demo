name: Deploy to Elastic Beanstalk environment

on:
  push:
    branches: [ dev, main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Prevent concurrent runs at the workflow level to avoid simultaneous deployments to the same environment.
concurrency:
  group: beanstalk-deploy

jobs:
  deploy_to_eb:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A better way is to use GitHub OIDC with an IAM role
    # but I'm going to use secrets for now for ease of demonstration.
    # See https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.EB_PYTHON_VERSION }}

      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      - name: Init EB directory
        run: |
          eb init ${{ vars.EB_APPLICATION_NAME }} -p python-${{ vars.EB_PYTHON_VERSION }} -r ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Deploy to Elastic Beanstalk environment
        run: >-
          eb deploy "${{ vars.EB_ENVIRONMENT_NAME }}"
          --message "Deploy ${{ github.sha }}"
