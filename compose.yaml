services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: load_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d load_demo"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://demo:demo@db:5432/load_demo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
